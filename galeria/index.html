<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galería · Buscador de imágenes</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="hero">
  <p class="eyebrow">Tu archivo personal</p>
  <h1 class="site-title">Galería</h1>

  <div class="search-wrap">
    <label for="buscador" class="visually-hidden">Buscar por nombre</label>
    <input
      type="search"
      id="buscador"
      placeholder="Escribe un nombre… por ejemplo, Miss"
      autocomplete="off"
    />
    <span class="search-glow" aria-hidden="true"></span>
  </div>

  <p class="contador" id="contador" aria-live="polite"></p>
</header>

<main>
  <section id="grid" class="grid" aria-label="Resultados"></section>

  <p class="estado-vacio" id="estado-vacio" hidden>
    No hay nada para <strong>"<span id="consulta-vacia"></span>"</strong>. Prueba con otra palabra.
  </p>
</main>

<footer class="pie">
  <p>Para añadir una imagen: súbela a <code>/images</code> y agrega una línea en <code>js/items.js</code></p>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Cerrar">✕</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="" />
</div>

<script src="js/items.js"></script>
<script src="js/app.js"></script>
</body>
</html>
